[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assist"
version = "1.0.0"
description = "CLI utility with AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "openai>=1.0.0"
]

[project.scripts]
ai-assist = "Ai.main:cli"
